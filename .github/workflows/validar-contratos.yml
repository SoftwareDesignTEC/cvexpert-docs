name: Validar contratos de integración

on:
  pull_request:
    paths:
      - "contratos/**"
      - "eventos/**"
      - "scripts/validar_contratos.py"
      - "requirements-contracts.txt"
      - ".github/workflows/validar-contratos.yml"
  push:
    branches: [main]
    paths:
      - "contratos/**"
      - "eventos/**"
      - "scripts/validar_contratos.py"
      - "requirements-contracts.txt"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: python -m pip install -r requirements-contracts.txt
      - name: Comprobar estructura y referencias
        run: python scripts/validar_contratos.py
